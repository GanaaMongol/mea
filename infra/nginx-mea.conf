# nginx ↔ Next locale contract for mea.mn
#
# This file sat empty while the real config lived only on the server, which is
# how the whole English site stayed broken without anyone noticing. If you
# change nginx on the box, change it here too.
#
# WHY nginx is involved at all: `mn` is the default locale and is served
# WITHOUT a prefix (`/about/vision`); `en` is served WITH one
# (`/en/about/vision`). Next routes both through `app/(frontend)/[lang]/...`,
# so a locale segment must always be present in the path it receives.
# `proxy.ts` cannot add it — in Next 16 standalone, NextResponse.rewrite()
# leaks to the client as a 307 (vercel/next.js#91844) — so nginx does.
#
# THE CONTRACT:
#
#   client asks      nginx proxies      x-locale-rewritten   result
#   ------------     ---------------    ------------------   ---------------
#   /news            /mn/news           1                    renders mn
#   /en/news         /en/news           0                    renders en
#   /mn/news         /mn/news           0                    proxy.ts 302 → /news
#
# The header is the only way `proxy.ts` can tell an injected prefix from a
# typed one. It must be derived from $request_uri, which `rewrite` never
# touches — deriving it from $uri reads the value AFTER the rewrite and always
# reports "injected".
#
# 2026-09-04 outage: the live config prefixed EVERY path, including paths that
# already began with a locale. `/en/news` reached Next as `/mn/en/news`, fell
# into the pages catch-all, and looked for a page whose slug is "en/news" —
# 404. Every English URL and every hand-typed `/mn/...` URL was dead. The
# `$needs_locale` guard below is what prevents that.

# 1 only for paths that carry no locale of their own and are not framework or
# Payload endpoints. Keyed on $request_uri so the value survives the rewrite.
map $request_uri $needs_locale {
    default                                       1;
    "~^/(mn|en)(/|\?|$)"                          0;
    "~^/(admin|api|_next|images)(/|\?|$)"         0;
    "~^/(favicon\.ico|robots\.txt|sitemap\.xml)"  0;
}

server {
    server_name mea.mn www.mea.mn;

    # Uploads go through the admin panel.
    client_max_body_size 25m;

    # Every page route is dynamic (see CLAUDE.md), so allow for a slow render
    # rather than handing the visitor a 504.
    proxy_read_timeout 60s;

    location / {
        # Internal rewrite: the browser's URL stays clean. `break` keeps the
        # request in this location so the proxy_pass below still applies.
        if ($needs_locale) {
            rewrite ^(.*)$ /mn$1 break;
        }

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        # Set unconditionally so a client can never forge it: when we did not
        # rewrite, this sends 0 rather than passing the client's own value.
        proxy_set_header x-locale-rewritten $needs_locale;

        proxy_pass http://127.0.0.1:3000;
    }

    # TLS: keep the certbot-managed listen/ssl_certificate lines that are
    # already on the server. Nothing above depends on them.
}

# Needed by the Connection header above; certbot's default config usually
# already defines it, in which case drop this block.
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
