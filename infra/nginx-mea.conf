# nginx ↔ Next locale contract for mea.mn
#
# Mirror of the live server block (/etc/nginx/sites-enabled/…), kept here so
# the rule the app depends on is not invisible. This file was empty until
# 2026-09-04, which is how the bug below survived unnoticed.
#
# WHY nginx is involved: `mn` is the default locale and is served WITHOUT a
# prefix (`/about/vision`); `en` is served WITH one (`/en/about/vision`). Next
# routes both through `app/(frontend)/[lang]/…`, so the path it receives must
# always carry a locale segment. `proxy.ts` cannot add it — in Next 16
# standalone, NextResponse.rewrite() leaks to the client as a 307
# (vercel/next.js#91844) — so nginx injects it.
#
# THE CONTRACT:
#
#   client asks    nginx proxies    x-locale-rewritten   result
#   ------------   --------------   ------------------   --------------------
#   /news          /mn/news         1                    renders mn
#   /en/news       /en/news         (absent)             renders en
#   /mn/news       /mn/news         (absent)             proxy.ts 302 → /news
#
# The header is the only way `proxy.ts` can tell an injected prefix from a
# typed one, and it must be set explicitly on every path so a client cannot
# forge it.
#
# 2026-09-04 outage: the live block rewrote `^(.*)$ → /mn$1` unconditionally
# and always sent `x-locale-rewritten 1`. `/en/news` reached Next as
# `/mn/en/news`, fell into the pages catch-all and looked for a page whose slug
# is "en/news" — 404. The entire English site was dead, as was every
# hand-typed `/mn/…` URL. The `location ~ ^/(mn|en)(/|$)` block below is the
# fix: paths that already carry a locale are passed through untouched.

server {
  server_name mea.mn www.mea.mn;
  client_max_body_size 25M;

  # Framework and Payload endpoints: never localised.
  location ~ ^/(admin|api|_next|images|favicon\.ico) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Already carries a locale — pass through unchanged. The empty value stops
  # the header being sent at all, so `/en/…` renders English and `/mn/…`
  # (only ever typed by a human) is redirected by proxy.ts to the clean URL.
  location ~ ^/(mn|en)(/|$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header x-locale-rewritten "";
  }

  # Everything else is Mongolian: inject the default locale internally, so the
  # browser's URL stays clean.
  location / {
    rewrite ^/$      /mn   break;
    rewrite ^(.*)$   /mn$1 break;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header x-locale-rewritten 1;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/mea.mn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mea.mn/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
