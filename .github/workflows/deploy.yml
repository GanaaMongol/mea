name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: build, POSTGRES_DB: build }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          DATABASE_URI: postgres://postgres:build@localhost:5432/build
          PAYLOAD_SECRET: build-only-secret
          NEXT_PUBLIC_SERVER_URL: https://mea.mn

      - name: SSH setup
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}"  > ~/.ssh/deploy
          printf '%s\n' "${{ secrets.MIGRATE_KEY }}" > ~/.ssh/migrate
          printf '%s\n' "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/migrate

      - name: Backup before migrate
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/migrate \
            deploy@${{ secrets.EC2_HOST }} dump > pre-migrate.dump
          ls -lh pre-migrate.dump

      - uses: actions/upload-artifact@v4
        with:
          name: pre-migrate-dump
          path: pre-migrate.dump
          retention-days: 14

      - name: Migrate
        run: |
          ssh -f -N -o ExitOnForwardFailure=yes -o BatchMode=yes \
            -i ~/.ssh/migrate -L 5433:127.0.0.1:5432 deploy@${{ secrets.EC2_HOST }}
          DATABASE_URI="postgres://mea:${{ secrets.DB_PASSWORD }}@127.0.0.1:5433/mea" \
          PAYLOAD_SECRET="${{ secrets.PAYLOAD_SECRET }}" \
          pnpm payload migrate

      - name: Deploy
        run: |
          # `cp -a src dst` nests src *inside* dst when dst already exists, and
          # .next/standalone ships its own traced `public/` (a file read via fs
          # at runtime lands there). That put every real asset at
          # public/public/images/... on the server, so /images/* 404'd apart
          # from the one traced file. Copy contents into a pre-made dir instead.
          mkdir -p out/.next/static out/public
          cp -a .next/standalone/. out/
          cp -a .next/static/. out/.next/static/
          cp -a public/. out/public/
          cp -a ecosystem.config.cjs out/
          for d in node_modules/.pnpm/@img+*; do
            rm -rf "out/node_modules/.pnpm/$(basename "$d")"
            cp -a "$d" out/node_modules/.pnpm/
          done
          find out -name "libvips*" | head
          tar cz --exclude='._*' -C out . \
            | ssh -i ~/.ssh/deploy deploy@${{ secrets.EC2_HOST }}